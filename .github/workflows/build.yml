name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Android scaffold
        run: |
          flutter create --org com.restoapp --project-name manager --platforms android tmp_scaffold
          cp -r tmp_scaffold/android ./android
          rm -rf tmp_scaffold
          sed -i 's/android:label="[^"]*"/android:label="My Order"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle*
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: my-order-apk
          path: build/app/outputs/flutter-apk/app-release.apk
